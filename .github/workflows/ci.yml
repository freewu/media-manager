name: CI

# 每次 push / PR 都跑一遍：类型检查 + 格式检查 + clippy + Rust 测试。
# 这是「完成任务必须 commit + push」流程的安全网，红了请立刻修。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 恢复官方 crates.io
        run: rm -f .cargo/config.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libxdo-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 前端构建
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
